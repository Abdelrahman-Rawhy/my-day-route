<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yawmi widget</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:500;src:url(/fonts/plus-jakarta-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;src:url(/fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;src:url(/fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}
:root{--a:1;--bg:20,24,38;--tx:#EEF0F7;--mu:#A3ABBE;--bd:rgba(255,255,255,.14);--ac:#8D72FF;--ac2:#22D3EE;--chk:rgba(255,255,255,.35);--row:rgba(255,255,255,.06);--red:#F87171;--grad:linear-gradient(135deg,#6D4AE8,#0E7490)}
html.light{--bg:255,255,255;--tx:#1B1F33;--mu:#55607A;--bd:rgba(20,24,60,.12);--ac:#5B3FD6;--ac2:#0E7490;--chk:rgba(20,24,60,.3);--row:rgba(20,24,60,.05);--red:#DC2626}
html.cream{--bg:251,245,234;--tx:#3B2A1A;--mu:#5E4A33;--bd:rgba(90,60,30,.16);--ac:#7A4E24;--ac2:#8A6030;--chk:rgba(90,60,30,.35);--row:rgba(122,78,36,.07);--red:#B42318;--grad:linear-gradient(135deg,#7A4E24,#8F6430)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',Tahoma,sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:6px;border-radius:20px;background:rgba(var(--bg),var(--a));border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(18px)}
.hd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 14px;-webkit-app-region:drag;min-height:44px}
.hd .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--row);color:var(--ac);flex:none}
.hd b{font-size:14.5px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;-webkit-app-region:no-drag}
.hd .sm{font-size:12px;color:var(--mu);font-weight:700;white-space:nowrap}
.mb{-webkit-app-region:no-drag;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--mu);display:grid;place-items:center;cursor:pointer;flex:none}
.mb:hover{background:var(--row)}
.bd{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 10px 12px}
.bd::-webkit-scrollbar{width:6px}.bd::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;min-height:40px}
.row:hover{background:var(--row)}
.row .t{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .m{font-size:12px;color:var(--mu);font-weight:700;white-space:nowrap}
.row .m.red{color:var(--red)}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--chk);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;transition:.15s}
.ck.r{border-radius:50%}
.ck:hover{border-color:var(--ac)}
.ck.p1{border-color:#3B82F6}.ck.p2{border-color:#F59E0B}.ck.p3{border-color:#EF4444}
.row.gone{opacity:0;transform:translateX(12px);transition:.35s}
.ck.on{background:var(--ac);border-color:var(--ac)}
.sec{font-size:11.5px;color:var(--mu);font-weight:800;padding:10px 6px 4px;letter-spacing:.2px}
.bar{height:6px;border-radius:6px;background:var(--row);overflow:hidden;margin:2px 6px 8px}.bar i{display:block;height:100%;background:var(--grad);border-radius:6px}
.big{padding:6px 8px 10px}.big .n{font-size:15px;font-weight:800;color:var(--mu)}.big .c{font-size:34px;font-weight:800;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate}.big .a{font-size:13px;color:var(--mu);font-weight:700}
.pr.nx{background:var(--row)}.pr.nx .t{color:var(--ac)}.pr.past{opacity:.55}
.empty{padding:22px 8px;text-align:center;color:var(--mu);font-size:13.5px;font-weight:700;line-height:1.7}
.plus{-webkit-app-region:no-drag;min-width:34px;height:30px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-weight:800;font-size:13px;cursor:pointer;padding:0 8px;white-space:nowrap}
.plus:hover{border-color:var(--ac);color:var(--ac)}
.cd .d{font-size:20px;font-weight:800;color:var(--ac);direction:ltr;unicode-bidi:isolate}
.e{font-size:18px;width:24px;text-align:center;flex:none}
.tile{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;cursor:pointer}.tile:hover{background:var(--row)}
.tile .t{flex:1;font-size:14px;font-weight:700}.tile .m{font-size:13px;color:var(--mu);font-weight:800;direction:ltr;unicode-bidi:isolate}
.wait{padding:30px 10px;text-align:center;color:var(--mu);font-size:13px}
html.lock .hd{-webkit-app-region:no-drag}
</style></head>
<body><div class="card"><div class="hd"><span class="ic" id="ic"></span><b id="ttl" title=""></b><span class="sm" id="sm"></span><button class="mb" id="mb" aria-label="Options"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div><div class="bd" id="bd"><div class="wait">…</div></div></div>
<script>
const Q=new URLSearchParams(location.search),TYPE=Q.get('type')||'today';
let D=null,timer=null;
const esc=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={today:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/>',prayers:'<path d="M12 3v3m-7 6h14M6 21V12a6 6 0 0 1 12 0v9M4 21h16"/>',tasks:'<path d="m5 12 4 4L19 6"/>',habits:'<path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-5a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/>',cds:'<path d="M8 3v3m8-3v3M4 9h16M5 5h14v15H5z"/>',faith:'<path d="M12 21s-7-4.5-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.5-7 11-7 11Z"/>'};
const svg=k=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||IC.today}</svg>`;
const ar=()=>D&&D.rtl;
const T=(a,e)=>ar()?a:e;
const OPEN={today:'today',prayers:'prayers',tasks:'tasks',habits:'habits',cds:'cds',faith:'adhkar'};
function title(){const L=(D&&D.L)||{};return {today:T('مسار النهارده',"Today's route"),prayers:L.prayers||T('مواعيد الصلاة','Prayer times'),tasks:L.todo||T('مهام النهارده',"Today's tasks"),habits:L.habits||T('العادات','Habits'),cds:L.cds||T('عدّاد الأيام','Countdown'),faith:T('إيمانيات النهارده','Faith today')}[TYPE]}
function act(x,el){if(el){const r=el.closest('.row');if(r)r.classList.add('gone');}window.yawmiW.act(x)}
function cdTxt(ms){let s=Math.max(0,Math.round(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0')}
function render(){
 const H=document.documentElement;H.classList.remove('light','cream');if(D&&D.theme==='light')H.classList.add('light');if(D&&D.theme==='cream')H.classList.add('light','cream');
 H.dir=ar()?'rtl':'ltr';H.lang=ar()?'ar':'en';
 document.getElementById('ic').innerHTML=svg(TYPE);const tt=title();document.getElementById('ttl').textContent=tt;document.getElementById('ttl').title=tt;
 const B=document.getElementById('bd'),sm=document.getElementById('sm');sm.textContent='';
 if(!D){B.innerHTML=`<div class="wait">${T('افتح يومي مرة عشان الويدجت يتملا','Open Yawmi once to fill this widget')}</div>`;return}
 const L=D.L||{};clearInterval(timer);timer=null;
 if(TYPE==='today'){const it=D.today||[];sm.textContent=(D.done||0)+'/'+(D.total||0);
  B.innerHTML=`<div class="bar"><i style="width:${D.pct||0}%"></i></div>`+(it.length?it.map(x=>`<div class="row"><button class="ck r" data-k="step" data-id="${esc(x.id)}" aria-label="done"></button><span class="t">${esc(x.n)}</span><span class="m">${esc(x.tt)}</span></div>`).join(''):`<div class="empty">${esc(L.complete||'')}<br>${esc(L.rest||'')}</div>`)}
 else if(TYPE==='tasks'){const a=D.todo||[],b=D.todoNext||[];sm.textContent=a.length?String(D.todoN||a.length):'';
  B.innerHTML=(a.length?a.map(x=>`<div class="row"><button class="ck p${x.pri||0}" data-k="task" data-id="${esc(x.id)}" aria-label="done"></button><span class="t">${esc(x.n)}</span><span class="m${x.ov?' red':''}">${esc(x.d)}</span></div>`).join(''):`<div class="empty">${esc(L.noTasks||'')}</div>`)
   +(b.length?`<div class="sec">${esc(L.later||'')}</div>`+b.slice(0,6).map(x=>`<div class="row"><button class="ck p${x.pri||0}" data-k="task" data-id="${esc(x.id)}" aria-label="done"></button><span class="t">${esc(x.n)}</span><span class="m">${esc(x.d)}</span></div>`).join(''):'')}
 else if(TYPE==='prayers'){const P=D.pday||[],now=Date.now();let nx=(D.prayers||[]).find(p=>p.t>now);
  const head=nx?`<div class="big"><div class="n">${esc(L.nextPrayer||'')}${T('، ',' · ')}${esc(nx.n)}</div><div class="c" id="cd">${cdTxt(nx.t-now)}</div><div class="a">${esc(nx.tt)}${D.dateH?T('، ',' · ')+esc(D.dateH):''}</div></div>`:'';
  B.innerHTML=head+P.map(p=>`<div class="row pr${nx&&p.t===nx.t?' nx':''}${p.t<now?' past':''}"><span class="t">${esc(p.n)}</span><span class="m">${esc(p.tt)}</span></div>`).join('');
  if(nx)timer=setInterval(()=>{const el=document.getElementById('cd');const left=nx.t-Date.now();if(left<=0){render();return}if(el)el.textContent=cdTxt(left)},1000);
  }
 else if(TYPE==='habits'){const h=D.habits||[];B.innerHTML=h.length?h.map(x=>`<div class="row"><span class="e">${esc(x.e)}</span><span class="t">${esc(x.n)}</span><span class="m"><bdi>${x.c}/${x.tg}</bdi>&nbsp;${esc(x.u)}</span><button class="plus" data-k="habit" data-id="${esc(x.id)}">+1</button></div>`).join(''):`<div class="empty">${esc(L.noHabits||'')}</div>`}
 else if(TYPE==='cds'){const c=D.cds||[];B.innerHTML=c.length?c.map(x=>`<div class="row cd"><span class="e">${esc(x.e)}</span><span class="t">${esc(x.n)}</span><span class="d">${x.days<=0?esc(L.today||''):x.days}</span></div>`).join(''):`<div class="empty">${esc(L.noCds||'')}</div>`}
 else if(TYPE==='faith'){const f=D.faith||{},a=f.adk||{},k=f.kh||{};
  B.innerHTML=`<div class="tile" data-open="adhkar"><span class="e">📿</span><span class="t">${esc(a.n||T('الأذكار','Adhkar'))}</span><span class="m">${a.d||0}/${a.t||0}</span></div>`
   +`<div class="tile" data-open="mushaf"><span class="e">📖</span><span class="t">${T('ورد القرآن','Quran pages')}</span><span class="m">${k.qp||0}/${k.tg||0}</span></div>`
   +`<div class="tile" data-open="tasbih"><span class="e">🤍</span><span class="t">${T('التسبيح','Tasbih')}</span><span class="m">${f.tz||0}</span></div>`}
}
document.addEventListener('click',e=>{const c=e.target.closest('[data-k]');if(c){e.stopPropagation();if(c.classList.contains('ck'))c.classList.add('on');act({k:c.dataset.k,id:c.dataset.id},c.dataset.k==='habit'?null:c);return}
 const o=e.target.closest('[data-open]');if(o){window.yawmiW.act({k:'open',v:o.dataset.open});return}
 if(e.target.closest('#ttl')){window.yawmiW.act({k:'open',v:OPEN[TYPE]});return}
 if(e.target.closest('#mb'))window.yawmiW.menu()});
document.addEventListener('contextmenu',e=>{e.preventDefault();window.yawmiW.menu()});
window.yawmiW.onData(d=>{D=d;render()});
window.yawmiW.onCfg(c=>{document.documentElement.style.setProperty('--a',String(c.op==null?1:c.op));document.documentElement.classList.toggle('lock',!!c.lock)});
render();window.yawmiW.ready();
</script></body></html>
